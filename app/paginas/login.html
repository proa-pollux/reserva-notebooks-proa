<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Notebooks - Inicio de sesión</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.js"></script>
    
    <script defer type="module" src="../js/login.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="bg-background text-on-surface min-h-screen flex flex-col justify-center items-center px-container-padding">

    <main class="w-full max-w-sm flex flex-col items-center">

        <!-- LOGO Y TÍTULO -->
        <div class="flex flex-col items-center mb-xl">
            <div class="w-24 h-24 mb-md rounded-2xl bg-surface-container-low shadow-sm flex items-center justify-center p-sm overflow-hidden">
                <img src="../img/logo.png" alt="Logo Reserva de Notebooks" class="w-full h-full object-contain mix-blend-multiply">
            </div>
            <h1 class="font-display-lg text-display-lg text-primary text-center">
                Reserva de Notebooks
            </h1>
        </div>

        <!-- FORMULARIO DE LOGIN -->
        <div class="bg-surface-container-lowest w-full rounded-xl shadow-sm p-lg flex flex-col gap-lg border border-surface-variant">

            <form id="loginForm" class="flex flex-col gap-gutter w-full" novalidate>

                <!-- CAMPO: CORREO ELECTRÓNICO -->
                <div class="relative w-full group">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none text-on-surface-variant">
                        <span class="material-symbols-outlined">mail</span>
                    </div>

                    <input 
                        id="email" 
                        type="email" 
                        required 
                        autocomplete="email" 
                        placeholder=" "
                        class="peer block w-full px-md pl-10 py-3 rounded-lg border border-outline bg-surface-bright text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-lg text-body-lg placeholder-transparent"
                    >

                    <label 
                        for="email"
                        class="absolute left-10 -top-2.5 bg-surface-container-lowest px-1 text-label-md text-on-surface-variant transition-all pointer-events-none peer-placeholder-shown:top-3 peer-placeholder-shown:text-body-lg peer-placeholder-shown:bg-transparent peer-focus:-top-2.5 peer-focus:text-label-md peer-focus:bg-surface-container-lowest peer-focus:text-primary"
                    >
                        Correo electrónico
                    </label>
                </div>

                <!-- CAMPO: CONTRASEÑA -->
                <div class="relative w-full group">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none text-on-surface-variant">
                        <span class="material-symbols-outlined">lock</span>
                    </div>

                    <input 
                        id="password" 
                        type="password" 
                        required 
                        autocomplete="current-password" 
                        placeholder=" "
                        class="peer block w-full px-md pl-10 pr-10 py-3 rounded-lg border border-outline bg-surface-bright text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-lg text-body-lg placeholder-transparent"
                    >

                    <label 
                        for="password"
                        class="absolute left-10 -top-2.5 bg-surface-container-lowest px-1 text-label-md text-on-surface-variant transition-all pointer-events-none peer-placeholder-shown:top-3 peer-placeholder-shown:text-body-lg peer-placeholder-shown:bg-transparent peer-focus:-top-2.5 peer-focus:text-label-md peer-focus:bg-surface-container-lowest peer-focus:text-primary"
                    >
                        Contraseña
                    </label>

                    <!-- Botón Mostrar/Ocultar Contraseña -->
                    <button 
                        type="button" 
                        id="togglePassword" 
                        tabindex="-1"
                        aria-label="Mostrar u ocultar contraseña"
                        class="absolute inset-y-0 right-0 flex items-center pr-sm text-on-surface-variant hover:text-on-surface focus:outline-none"
                    >
                        <span class="material-symbols-outlined text-[20px]" id="togglePasswordIcon">visibility</span>
                    </button>
                </div>

                <!-- CONTENEDOR DE ERROR -->
                <div 
                    id="mensajeError" 
                    role="alert" 
                    aria-live="polite"
                    class="hidden bg-error-container text-on-error-container rounded-lg p-sm flex items-center gap-sm"
                >
                    <span class="material-symbols-outlined shrink-0">error</span>
                    <p id="mensajeErrorTexto" class="font-body-md text-body-md"></p>
                </div>

                <!-- BOTÓN SUBMIT -->
                <button 
                    id="btnLogin" 
                    type="submit"
                    class="mt-sm w-full bg-primary-container text-on-primary-container font-label-lg text-label-lg font-bold py-3 px-md rounded-full shadow-sm hover:bg-primary hover:text-on-primary active:scale-95 transition-all flex justify-center items-center gap-sm h-12 disabled:opacity-50 disabled:pointer-events-none"
                >
                    <span id="btnText">Iniciar sesión</span>
                    <span class="material-symbols-outlined" id="btnIcon">arrow_forward</span>
                </button>

            </form>

            <!-- INFORMACIÓN ADICIONAL -->
            <div class="flex items-center gap-xs justify-center text-on-surface-variant bg-surface-container-low p-sm rounded-lg">
                <span class="material-symbols-outlined text-title-lg font-title-lg shrink-0">info</span>
                <p class="font-body-md text-body-md">
                    La contraseña inicial es su DNI
                </p>
            </div>

        </div>

    </main>

    <!-- JS para el toggle de contraseña (puede incluirse dentro de login.js) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePasswordIcon');

            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    toggleIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
                });
            }
        });
    </script>
</body>

</html>
